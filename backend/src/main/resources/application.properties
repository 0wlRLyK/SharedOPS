spring.application.name=sharedops-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API pagination (example values)
sharedops.api.pagination.default-page-size=20
sharedops.api.pagination.max-page-size=100
spring.datasource.hikari.maximum-pool-size=${MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${CONNECTION_TIMEOUT:30000}

spring.modulith.detection-strategy=explicitly-annotated
