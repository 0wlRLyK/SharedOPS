openapi: 3.1.0
servers:
  - url: http://localhost:8080
    description: Local development
info:
  title: SharedOPS API
  version: 1.0.0
  description: |
    This manually maintained file is the source of truth for the API contract
    (see ADR-0008). Structured errors use RFC 9457 Problem Details with
    application/problem+json; code and fieldErrors are SharedOPS extensions.
    The task operation below is planned and is not yet implemented. Error
    responses and input rules marked planned are commitments for subsequent
    feature tickets, not a claim that those features are available today.

    Input normalization is field-specific: email is stripped of surrounding
    whitespace and lowercased using locale-independent rules before validation.
    Passwords are passed unchanged, including whitespace, and must never be
    silently trimmed, case-folded, or otherwise rewritten. Passwords are limited
    to 72 UTF-8 bytes. New passwords above this limit fail validation; overlong
    login or current-password inputs are rejected as invalid credentials. Legacy
    BCrypt credentials created from longer inputs require recovery; verification
    does not accept truncated equivalents. Automated password reset is not
    available in the MVP. Other fields are not normalized unless their own
    contract explicitly says so.

    Fetch a CSRF token before unsafe requests and again after login, which
    rotates both the session identifier and CSRF token. Logout invalidates the
    current session. Password change requires the current password and revokes
    all account sessions. Regular sessions expire after 30 minutes idle or 8
    hours from login; opt-in persistent sessions expire after 7 days idle or
    30 days from login. Cookies are HttpOnly, SameSite=Lax and Secure by default.

    Error codes and status meanings:
    * 400 VALIDATION_ERROR: request validation failed; fieldErrors identifies fields.
    * 400 INVALID_VALUE: a JSON value has an invalid type or enum value;
      fieldErrors is included when the deserializer has a field path.
    * 400 MALFORMED_JSON: body is missing or cannot be parsed as JSON.
    * 401 UNAUTHORIZED: authentication is required.
    * 401 INVALID_CREDENTIALS: the supplied login or current-password credentials are invalid.
    * 403 FORBIDDEN: an authenticated caller is denied access.
    * 404 NOT_FOUND: a resource is absent or inaccessible in the
      caller's household; responses must not reveal which case applies.
    * 409 INVITATION_CONFLICT: invitation cannot be used due to membership, capacity, or terminal state.
    * 409 ACTIVE_HOUSEHOLD_EXISTS: account already has an active household membership.
    * 409 VERSION_CONFLICT: a command's body version is stale. Transactional
      checking and unchanged persisted state are verified in the command ticket.
    * 415 UNSUPPORTED_MEDIA_TYPE: the request content type is unsupported.
    * 429 RATE_LIMITED (planned): a request exceeded a configured rate limit.
    * 409 EMAIL_ALREADY_REGISTERED: the normalized email is already associated with an account.

    Field paths use dot-separated property names and zero-based array indexes,
    for example items[0].status. Paths stop before user-supplied map keys.
    Rejected values and exception details are not returned. Responses and status
    codes beyond implemented handlers must be
    implemented and tested with their corresponding feature.

paths:
  /api/v1/households:
    post:
      summary: Create household
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdCreateRequest"
      responses:
        "201":
          description: Household and initial membership created atomically.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Account already has an active household membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}:
    get:
      summary: Get an accessible household
      operationId: getHousehold
      parameters:
        - name: householdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Household visible to an active member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Household is absent or inaccessible.
          content:
            application/problem+json:
              schema:
                type: object
                required: [title, status, detail, code]
                additionalProperties: false
                properties:
                  title: { const: "Not Found" }
                  status: { const: 404 }
                  detail: { const: "Resource not found." }
                  code: { const: "NOT_FOUND" }
  /api/v1/households/{householdId}/responsibilities:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      summary: Create an individual responsibility
      operationId: createResponsibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityCreateRequest" }
      responses:
        "201":
          description: Responsibility created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    get:
      summary: List current or archived responsibilities
      description: Current includes ACTIVE and PAUSED; results are ordered by ID.
      operationId: listResponsibilities
      parameters:
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [current, archived] }
      responses:
        "200":
          description: Responsibilities in the selected view.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResponsibilityResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    get:
      operationId: getResponsibility
      summary: getResponsibility
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}/details:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    put:
      operationId: updateResponsibilityDetails
      summary: updateResponsibilityDetails
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityDetailsRequest" }
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResponsibilityConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}/transfer:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    post:
      operationId: transferResponsibility
      summary: transferResponsibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityTransferRequest" }
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResponsibilityConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}/pause:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    post:
      operationId: pauseResponsibility
      summary: pauseResponsibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityVersionRequest" }
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResponsibilityConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}/resume:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    post:
      operationId: resumeResponsibility
      summary: resumeResponsibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityVersionRequest" }
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResponsibilityConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}/archive:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    post:
      operationId: archiveResponsibility
      summary: archiveResponsibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityVersionRequest" }
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResponsibilityConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}/responsibilities/{responsibilityId}/restore:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ResponsibilityId"
    post:
      operationId: restoreResponsibility
      summary: restoreResponsibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibilityRestoreRequest" }
      responses:
        "200":
          description: Responsibility returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResponsibilityConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      summary: Create a single-use household invitation
      description: The secret is returned once and expires 24 hours after creation. Share it securely outside this API.
      operationId: createInvitation
      responses:
        "201":
          description: Invitation created; response contains its bearer secret once.
          headers:
            Cache-Control:
              description: The response must not be stored.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Revoke an unused household invitation
      operationId: revokeInvitation
      responses:
        "204":
          description: Invitation revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvitationConflict"
  /api/v1/invitations/accept:
    post:
      summary: Accept a single-use invitation
      description: Supply the bearer secret only in the request body. Unknown, expired, revoked and consumed invitations have the same response.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptRequest"
      responses:
        "200":
          description: Household joined and invitation consumed atomically.
          headers:
            Cache-Control:
              description: The response must not be stored.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvitationConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/auth/me:
    get:
      summary: Get current account and active household
      operationId: getCurrentContext
      responses:
        "200":
          description: Current account and its active household, if any.
          headers:
            Cache-Control:
              description: The response must not be stored.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentContextResponse" }
        "401":
          description: Authentication required.
          headers:
            Cache-Control:
              description: The response must not be stored.
              schema: { type: string, const: no-store }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/v1/auth/register:
    post:
      summary: Sign up
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Sign up response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security: []
  /api/v1/auth/csrf:
    get:
      summary: Get CSRF token
      operationId: getCsrfToken
      responses:
        "200":
          description: Get CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
      security: []
  /api/v1/auth/login:
    post:
      summary: Log in
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Log in response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security: []

  /api/v1/auth/password:
    post:
      summary: Change password and revoke all sessions
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; authenticate again
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/auth/logout:
    post:
      summary: Invalidate the current session
      operationId: logOut
      responses:
        "204":
          description: Session invalidated
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tasks/{taskId}:
    get:
      description: Planned operation; not yet implemented.
      summary: Get task by ID
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResponsibilityId:
      name: responsibilityId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  responses:
    ResponsibilityConflict:
      description: VERSION_CONFLICT for a stale version or INVALID_STATE for an invalid lifecycle transition.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ApiProblem" }
    InvitationConflict:
      description: Invitation cannot be used due to active membership, capacity, or terminal state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Forbidden:
      description: Access denied or missing or invalid CSRF token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Conflict:
      description: Resource version conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    UnsupportedMediaType:
      description: Unsupported request content type
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    RateLimited:
      description: Planned response when the configured request limit is exceeded.
      headers:
        Retry-After:
          description: Delay in seconds before retrying, when known.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    EmailAlreadyRegistered:
      description: Such email is already registered.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"

  schemas:
    ResponsibilityCreateRequest:
      type: object
      additionalProperties: false
      required: [title, mode, ownerAccountId]
      properties:
        title:
          {
            type: string,
            pattern: '^(?![\s\S]*\u0000)[\s\S]*[^\u0009-\u000D\u001C-\u0020\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]',
          }
        description:
          {
            type: [string, "null"],
            pattern: '^[^\u0000]*$',
            description: "Omitted or null means no description; empty string is retained.",
          }
        mode: { type: string, enum: [INDIVIDUAL] }
        ownerAccountId: { type: string, format: uuid }
    ResponsibilityDetailsRequest:
      type: object
      additionalProperties: false
      required: [version, title]
      properties:
        version: { $ref: "#/components/schemas/ResponsibilityVersion" }
        title:
          {
            type: string,
            pattern: '^(?![\s\S]*\u0000)[\s\S]*[^\u0009-\u000D\u001C-\u0020\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]',
          }
        description:
          {
            type: [string, "null"],
            pattern: '^[^\u0000]*$',
            description: "Omitted or null clears; empty string is retained.",
          }
    ResponsibilityTransferRequest:
      type: object
      additionalProperties: false
      required: [version, ownerAccountId]
      properties:
        version: { $ref: "#/components/schemas/ResponsibilityVersion" }
        ownerAccountId: { type: string, format: uuid }
    ResponsibilityVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/ResponsibilityVersion" }
    ResponsibilityRestoreRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/ResponsibilityVersion" }
        ownerAccountId:
          {
            type: string,
            format: uuid,
            description: "Omit to use the active historical owner; null is invalid.",
          }
    ResponsibilityVersion:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
    ResponsibilityResponse:
      type: object
      required: [id, householdId, title, description, mode, status, ownerAccountId, version]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        mode: { type: string, enum: [INDIVIDUAL] }
        status: { type: string, enum: [ACTIVE, PAUSED, ARCHIVED] }
        ownerAccountId: { type: string, format: uuid }
        version: { $ref: "#/components/schemas/ResponsibilityVersion" }
    InvitationAcceptRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Canonical unpadded base64url encoding of a 32-byte bearer secret; never include in a URL.
    InvitationResponse:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: One-time bearer secret, returned only on creation.
        expiresAt:
          type: string
          format: date-time
          description: Deadline exactly 24 hours after creation; invalid at or after this instant.
    HouseholdCreateRequest:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
          description: Trim Unicode White_Space at both ends; require 1–100 code points; preserve internal whitespace and case.
        icon:
          type: [string, "null"]
          maxLength: 100
          description: Optional; reject blank values and preserve nonblank content.
        currency:
          type: string
          enum: [EUR, UAH, USD, GBP, PLN, CHF, CZK, DKK, NOK, SEK]
        timezone:
          type: string
          default: Europe/Berlin
          description: Valid IANA zone; omitted defaults to Europe/Berlin; null and offsets are invalid.
    HouseholdResponse:
      type: object
      required: [id, name, icon, currency, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, "null"] }
        currency: { type: string }
        timezone: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          writeOnly: true
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
      required:
        - email
        - password

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
      required:
        - id
        - email
    CurrentContextResponse:
      type: object
      required: [account, household]
      properties:
        account: { $ref: "#/components/schemas/AccountResponse" }
        household:
          oneOf:
            - $ref: "#/components/schemas/CurrentContextHousehold"
            - type: "null"
    CurrentContextHousehold:
      type: object
      required: [id, name, icon, currency, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, "null"] }
        currency: { type: string }
        timezone: { type: string }
    CsrfTokenResponse:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
      required:
        - headerName
        - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
        rememberMe:
          type: boolean
          default: false
      required:
        - email
        - password
    FieldErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
          description: Stable field error code.
          enum: [REQUIRED, INVALID_FORMAT, INVALID_VALUE]
        message:
          type: string

    ApiProblem:
      type: object
      required:
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable application error code; planned codes are described above.
          enum:
            - ACTIVE_HOUSEHOLD_EXISTS
            - INVITATION_CONFLICT
            - VALIDATION_ERROR
            - INVALID_VALUE
            - MALFORMED_JSON
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - VERSION_CONFLICT
            - INVALID_OWNER
            - INVALID_STATE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - EMAIL_ALREADY_REGISTERED
            - INVALID_CREDENTIALS

        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorDetail"

    TaskResponse:
      type: object
      required:
        - id
        - responsibilityId
      properties:
        id:
          type: string
          format: uuid
        responsibilityId:
          type: string
          format: uuid

security:
  - sessionCookie: []
